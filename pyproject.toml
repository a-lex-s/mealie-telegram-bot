[project]
name = "mealie-telegram-bot"
version = "0.2.0"
description = "Telegram bot front end for a self-hosted Mealie instance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Exact, hash-locked versions live in requirements.txt (generated from this list).
dependencies = [
  "aiogram>=3.31,<4",
  "httpx>=0.28,<0.29",
  # aiogram 3.31 supports pydantic < 2.14 only; keep the lock files inside that range.
  "pydantic>=2.4.1,<2.14",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Only ship the bot package. Without this, setuptools scans the repository root and
# refuses to build when an extra directory such as `secrets/` exists next to it.
[tool.setuptools.packages.find]
include = ["mealie_bot*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Emoji used in bot texts that ruff confuses with ASCII look-alikes.
allowed-confusables = ["➕"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
files = ["mealie_bot"]
strict = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["mealie_bot"]

[tool.coverage.report]
# Measured coverage rounded down; raise it when the measured value grows.
fail_under = 95
show_missing = true
skip_covered = true

# Layer boundaries, checked by `lint-imports` in CI.
[tool.importlinter]
root_packages = ["mealie_bot"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Parser and service do not depend on Telegram"
type = "forbidden"
source_modules = [
  "mealie_bot.features.shopping.parser",
  "mealie_bot.features.shopping.service",
]
forbidden_modules = ["aiogram"]

[[tool.importlinter.contracts]]
name = "The Mealie client knows nothing about features or Telegram"
type = "forbidden"
source_modules = ["mealie_bot.mealie"]
forbidden_modules = ["mealie_bot.features", "mealie_bot.telegram", "aiogram"]

[[tool.importlinter.contracts]]
name = "Feature modules do not import each other"
type = "independence"
modules = ["mealie_bot.features.*"]
