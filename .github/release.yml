# Categories for the generated release notes.
changelog:
  exclude:
    authors:
      - dependabot
  categories:
    - title: Features
      labels: ["*"]
      exclude:
        labels: [bug, documentation, ci, dependencies]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: CI and dependencies
      labels: [ci, dependencies]
