version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      # pydantic pins an exact pydantic-core version; bump them together.
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
      # Development tools only live in requirements-dev.txt; one PR per week.
      dev-tools:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "pip-audit"
          - "zizmor"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(docker)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      # One PR for all action bumps instead of one CI run per action.
      actions:
        patterns:
          - "*"
