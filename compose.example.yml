# Example Compose file with three variants; keep the one you need.
#
# 1. Next to Mealie (default below): copy the service into the stack that
#    already runs Mealie and adjust the image tag, digest and network name.
# 2. Standalone: the bot runs on any host and reaches Mealie over HTTPS
#    (reverse proxy with a valid certificate). Set MEALIE_URL to the public URL,
#    drop the "networks" entries and the external network at the bottom.
# 3. Local testing with Mealie on localhost: see the commented service further down.
#
# The bot runs as UID 10001. Compose bind-mounts the secret files with their host
# permissions, so they must be readable by that user, for example:
#   chmod 644 secrets/telegram_bot_token secrets/mealie_api_token
# (or chown 10001 for 0400). A root-only 0600 file ends in "Permission denied".
# No healthcheck: the bot only long-polls Telegram, so there is no cheap check
# that says more than "process alive"; restart: unless-stopped covers crashes.
services:
  mealie-telegram-bot:
    image: ghcr.io/a-lex-s/mealie-telegram-bot:v0.1.0  # append @sha256:<digest> to pin
    restart: unless-stopped
    environment:
      MEALIE_URL: http://mealie:9000
      # Standalone against a public Mealie instead (variant 2); the certificate is verified:
      # MEALIE_URL: https://mealie.example.com
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      MEALIE_API_TOKEN_FILE: /run/secrets/mealie_api_token
      # Telegram user IDs of everyone allowed to use the bot (placeholders).
      ALLOWED_USER_IDS: "123456789,987654321"
      # Optional:
      # BOT_LANGUAGE: de           # force one language for everybody
      # SHOPPING_LIST: Groceries   # default list (name or ID); otherwise the first list
      # SHOPPING_CREATE_FOODS: "false"  # "true" creates a Mealie food for unknown item names
      # FEATURE_SHOPPING: "true"
      # DELETE_COMMANDS: "true"   # delete /list etc. after handling; "false" keeps them
      # DELETE_ITEM_MESSAGES: "true"  # delete your item messages once added; "false" keeps them
      # LABEL_EMOJI: "Würzmittel=🌶️;Tiere=🐾"  # emoji per label name; otherwise a keyword table
      # LABEL_ICONS: both          # before category names: both, color, emoji or none
      # HISTORY_FOLD_HOURS: "24"   # fold older history entries into one message; "0" = off
      # TZ: Europe/Berlin          # time zone for the "as of" and history times
      # LOG_LEVEL: INFO
    secrets:
      - telegram_bot_token
      - mealie_api_token
    networks:            # variant 1 only; remove for variant 2
      - mealie
    # No ports: the bot uses long polling and only talks to Telegram and Mealie.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Local testing variant (3): Mealie runs on the host (for example in WSL) and
  # is reachable at http://localhost:9000. Comment out the service above and
  # uncomment this one; the "networks" block at the bottom is not needed then.
  # mealie-telegram-bot-local:
  #   build: .                      # or the same image as above
  #   restart: unless-stopped
  #   network_mode: host            # share the host network so localhost is Mealie
  #   environment:
  #     MEALIE_URL: http://localhost:9000
  #     TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
  #     MEALIE_API_TOKEN_FILE: /run/secrets/mealie_api_token
  #     ALLOWED_USER_IDS: "123456789"
  #     LOG_LEVEL: DEBUG
  #   secrets:
  #     - telegram_bot_token
  #     - mealie_api_token
  #   read_only: true
  #   cap_drop: [ALL]
  #   security_opt:
  #     - no-new-privileges:true

# The bot runs as UID 10001, so these files must be readable by that user:
# chown 10001 secrets/* && chmod 0400 secrets/*  (see docs/configuration.md).
secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  mealie_api_token:
    file: ./secrets/mealie_api_token

networks:              # variant 1 only; remove for variant 2
  mealie:
    external: true
